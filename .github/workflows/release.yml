name: Release

# Pushing a tag like v1.1.0 builds Calisto.exe and attaches it to a GitHub release.
# The app's "Check for updates" reads that release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish single-file exe
        run: >
          dotnet publish Calisto.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Calisto ${{ steps.ver.outputs.version }}
          files: publish/Calisto.exe
          generate_release_notes: true
